name: "Verify Deployed Contract"
description: "Verify that deployed bytecode matches compiled source from Etherscan"
author: "ivan09069"

inputs:
  address:
    description: "Contract address to verify"
    required: true
  network:
    description: "Network name (mainnet, sepolia, goerli, polygon, arbitrum, optimism, base)"
    required: true
    default: "mainnet"
  etherscan-key:
    description: "Etherscan API key"
    required: true
  blockscout-key:
    description: "Blockscout PRO API key (optional; falls back to per-instance lookup and bytecode heuristics)"
    required: false
  rpc-url:
    description: "Custom RPC URL (overrides default public RPC)"
    required: false

outputs:
  status:
    description: "PASS, FAIL, or SKIP (SKIP is not verification success)"
  proxy:
    description: "true when the target is detected as a proxy"
  implementation-address:
    description: "Resolved proxy implementation address, when available"
  hash-algorithm:
    description: "sha256; hashes cover decoded normalized bytecode bytes"
  on-chain-hash:
    description: "SHA-256 of normalized on-chain bytecode"
  compiled-hash:
    description: "SHA-256 of normalized compiled bytecode"

runs:
  using: "node20"
  main: "index.mjs"

branding:
  icon: "check-circle"
  color: "green"
