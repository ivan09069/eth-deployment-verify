name: "Verify Deployed Contract"
description: "Verify deployed bytecode against compiled source through Sourcify, Blockscout, and Etherscan"
author: "ivan09069"

inputs:
  address:
    description: "Contract address to verify"
    required: true
  network:
    description: "Network name (mainnet, sepolia, goerli, polygon, arbitrum, optimism, base)"
    required: true
    default: "mainnet"
  etherscan-key:
    description: "Etherscan API key (optional fallback after Sourcify and Blockscout)"
    required: false
  blockscout-key:
    description: "Blockscout PRO API key (optional; falls back to per-instance lookup and bytecode heuristics)"
    required: false
  rpc-url:
    description: "Custom RPC URL (overrides default public RPC)"
    required: false

outputs:
  status:
    description: "PASS or FAIL"
  proxy:
    description: "true when the target is detected as a proxy"
  implementation-address:
    description: "Resolved proxy implementation address, when available"
  on-chain-hash:
    description: "First 16 hex characters of SHA-256 of the normalized on-chain bytecode hex"
  compiled-hash:
    description: "First 16 hex characters of SHA-256 of the normalized compiled bytecode hex"

runs:
  using: "node20"
  main: "index.mjs"

branding:
  icon: "check-circle"
  color: "green"
